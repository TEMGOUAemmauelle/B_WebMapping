server {
    listen 80;
    server_name c220g2-011025.wisc.cloudlab.us;

    # Option 1 : servir GeoServer en HTTP (pour tests)
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Content-Security-Policy "default-src 'self'; form-action 'self' http://$host;" always;
    }

    # Option 2 : rediriger vers HTTPS (décommenter pour HTTPS)
    # return 301 https://$host$request_uri;
}

# ===== HTTPS server =====
server {
    listen 443 ssl;
    server_name c220g2-011025.wisc.cloudlab.us;

    ssl_certificate /etc/letsencrypt/live/c220g2-011025.wisc.cloudlab.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c220g2-011025.wisc.cloudlab.us/privkey.pem;

    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # ⚡ Important pour GeoServer derrière HTTPS
        proxy_redirect http:// https://;

        # Headers pour CSP / login / cookies
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /favicon.ico {
        proxy_pass http://geoserver:8080/geoserver/favicon.ico;
    }
}
