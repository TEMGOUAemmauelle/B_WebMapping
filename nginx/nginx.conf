# =========================
# HTTP → HTTPS
# =========================
server {
    listen 80;
    server_name clnode321.clemson.cloudlab.us;

    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================
# HTTPS Reverse Proxy
# =========================
server {
    listen 443 ssl;
    server_name clnode321.clemson.cloudlab.us;

    ssl_certificate     /etc/letsencrypt/live/clnode321.clemson.cloudlab.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clnode321.clemson.cloudlab.us/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # ⚡ Important pour GeoServer derrière HTTPS
        proxy_redirect http:// https://;

        # Headers pour CSP / login / cookies
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
    }
}
